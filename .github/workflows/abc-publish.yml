name: ABC Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_job:
        description: 'Publish job to run (leave empty to run all)'
        required: false
        type: choice
        options:
          - ''
          - publish-pypi
          - publish-npm
          - publish-nuget
          - publish-docker
      skip_tests:
        description: 'Skip tests'
        required: false
        type: choice
        options:
          - ''
          - skip-python-test
          - skip-js-test
          - skip-dotnet-test
          - skip-all-tests

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Python tests
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests != 'skip-python-test' && github.event.inputs.skip_tests != 'skip-all-tests')
        run: |
          pip install -e ".[dev]" pytest pytest-asyncio
          pytest tests/ -v -m "not slow"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - name: JavaScript tests
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests != 'skip-js-test' && github.event.inputs.skip_tests != 'skip-all-tests')
        run: cd js && npm ci && npm run build && npm test
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: .NET tests
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests != 'skip-dotnet-test' && github.event.inputs.skip_tests != 'skip-all-tests')
        run: dotnet test dotnet/CloakBrowser.sln -c Release

  validate-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Check tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY=$(python -c 'import re; print(re.search(r"__version__\s*=\s*[\"'\'']([^\"'\'']+)", open("cloakbrowser/_version.py").read()).group(1))')
          JS=$(python -c 'import json; print(json.load(open("js/package.json"))["version"])')
          NET=$(python -c 'import re; print(re.search(r"<Version>([^<]+)", open("dotnet/src/CloakBrowser/CloakBrowser.csproj").read()).group(1))')
          echo "Tag: $TAG | Python: $PY | npm: $JS | .NET: $NET"
          [ "$TAG" = "$PY" ] || { echo "ERROR: tag v$TAG != _version.py $PY"; exit 1; }
          [ "$TAG" = "$JS" ] || { echo "ERROR: tag v$TAG != package.json $JS"; exit 1; }
          [ "$TAG" = "$NET" ] || { echo "ERROR: tag v$TAG != CloakBrowser.csproj $NET"; exit 1; }

  publish-pypi:
    needs: [test, validate-version]
    if: always() && (needs.test.result == 'success' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.skip_tests == 'skip-python-test' || github.event.inputs.skip_tests == 'skip-all-tests'))) && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped') && (github.event.inputs.publish_job == '' || github.event.inputs.publish_job == 'publish-pypi')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC trusted publishing — no PYPI_TOKEN needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1

  publish-npm:
    needs: [test, validate-version]
    if: always() && (needs.test.result == 'success' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.skip_tests == 'skip-python-test' || github.event.inputs.skip_tests == 'skip-all-tests'))) && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped') && (github.event.inputs.publish_job == '' || github.event.inputs.publish_job == 'publish-npm')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC trusted publishing + provenance — no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Build
        run: cd js && npm ci && npm run build
      - name: Publish to npm
        run: cd js && npm publish --provenance --access public

  publish-nuget:
    needs: [test, validate-version]
    if: always() && (needs.test.result == 'success' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.skip_tests == 'skip-python-test' || github.event.inputs.skip_tests == 'skip-all-tests'))) && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped') && (github.event.inputs.publish_job == '' || github.event.inputs.publish_job == 'publish-nuget')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC trusted publishing — no NUGET_API_KEY secret needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: NuGet login (OIDC trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
        with:
          user: CloakHQ
      - name: Pack
        run: dotnet pack dotnet/src/CloakBrowser/CloakBrowser.csproj -c Release -o out
      - name: Publish to NuGet
        run: dotnet nuget push out/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-docker:
    needs: [validate-version]
    if: always() && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped') && (github.event.inputs.publish_job == '' || github.event.inputs.publish_job == 'publish-docker')
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Cosign keyless signing + attestations
      contents: read
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Extract version
        run: |
          VERSION=$(python -c 'import re; print(re.search(r"__version__\s*=\s*[\"'\'']([^\"'\'']+)", open("cloakbrowser/_version.py").read()).group(1))')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: luoweb
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/luoweb/cloakbrowser:${{ env.VERSION }}
            ghcr.io/luoweb/cloakbrowser:latest
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign image
        run: cosign sign --yes ghcr.io/luoweb/cloakbrowser@${{ steps.build.outputs.digest }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/luoweb/cloakbrowser
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
